name: Validate UNLXCK Outreach Integrations

on:
  push:
    branches:
      - main
    paths:
      - "smoke_test.py"
      - "core.py"
      - "pipeline.py"
      - "tests/**"
      - ".github/workflows/validate.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: unlxck-outreach-validation
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run unit tests
        run: python -m unittest discover -s tests -v

      - name: Safe pipeline dry run
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          NOTION_API_KEY: ${{ secrets.NOTION_API_KEY }}
          NOTION_DATA_SOURCE_ID: "08d8b476-129a-42b0-b980-102b08ce4bd8"
          OPENAI_MODEL: "gpt-5.6-luna"
          MAX_CANDIDATES_PER_RUN: "1"
          DRY_RUN: "true"
        run: python pipeline.py

      - name: Safe Notion + OpenAI smoke test
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          NOTION_API_KEY: ${{ secrets.NOTION_API_KEY }}
          NOTION_DATA_SOURCE_ID: "08d8b476-129a-42b0-b980-102b08ce4bd8"
          OPENAI_MODEL: "gpt-5.6-luna"
          MAX_CANDIDATES_PER_RUN: "1"
          DRY_RUN: "true"
        run: python smoke_test.py
