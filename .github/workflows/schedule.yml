name: UNLXCK Outreach AI

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Preview decisions without writing to Notion"
        required: true
        default: true
        type: boolean
      page_id:
        description: "Optional Notion page ID for an immediate single-prospect run"
        required: false
        default: ""
        type: string

permissions:
  contents: read

concurrency:
  group: outreach-manual
  cancel-in-progress: false

jobs:
  process-prospects:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run unit tests
        run: python -m unittest discover -s tests -v

      - name: Run one manual queue pass
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          NOTION_API_KEY: ${{ secrets.NOTION_API_KEY }}
          NOTION_DATA_SOURCE_ID: "08d8b476-129a-42b0-b980-102b08ce4bd8"
          OPENAI_MODEL: "gpt-5.6-luna"
          MAX_CANDIDATES_PER_RUN: "100"
          TARGET_PAGE_ID: ${{ inputs.page_id }}
          DRY_RUN: ${{ inputs.dry_run && 'true' || 'false' }}
        run: python pipeline.py
