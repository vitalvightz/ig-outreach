name: UNLXCK Outreach AI

on:
  schedule:
    - cron: "0 8-17 * * 1-5" # hourly on weekdays; GitHub cron uses UTC
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Preview decisions without writing to Notion"
        required: true
        default: true
        type: boolean

permissions:
  contents: read

concurrency:
  group: unlxck-outreach-ai-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run unit tests
        run: python -m unittest discover -s tests -v

      - name: Safe Notion + OpenAI smoke test
        if: github.event_name == 'pull_request' || (github.event_name == 'workflow_dispatch' && inputs.dry_run)
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          NOTION_API_KEY: ${{ secrets.NOTION_API_KEY }}
          NOTION_DATA_SOURCE_ID: "08d8b476-129a-42b0-b980-102b08ce4bd8"
          OPENAI_MODEL: "gpt-5.6-luna"
          MAX_CANDIDATES_PER_RUN: "1"
          DRY_RUN: "true"
        run: python smoke_test.py

      - name: Qualify and draft outreach
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          NOTION_API_KEY: ${{ secrets.NOTION_API_KEY }}
          NOTION_DATA_SOURCE_ID: "08d8b476-129a-42b0-b980-102b08ce4bd8"
          OPENAI_MODEL: "gpt-5.6-luna"
          MAX_CANDIDATES_PER_RUN: "100"
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run && 'true' || 'false' }}
        run: python main.py
